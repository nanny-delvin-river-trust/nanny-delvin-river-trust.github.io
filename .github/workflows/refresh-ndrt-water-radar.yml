name: Refresh NDRT water radar

on:
  workflow_dispatch:
  schedule:
    - cron: "21 5 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-ndrt-water-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r news/ops/requirements.txt

      - name: Refresh NDRT water radar
        run: |
          python news/ops/discover_ndrt_news.py
          python news/ops/enrich_ndrt_research.py
          python news/ops/audit_ndrt_radar.py

      - name: Validate generated data
        run: |
          python -m json.tool news/data/news.json >/dev/null
          python -m json.tool news/data/source-health.json >/dev/null
          python -m json.tool news/data/weekly-digest.json >/dev/null
          python -m json.tool news/data/archive/index.json >/dev/null

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/data/news.json news/data/archive news/data/source-health.json news/data/weekly-digest.json
          if git diff --cached --quiet; then
            echo "No NDRT water radar data changes."
          else
            git commit -m "Refresh NDRT water radar"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              echo "Push failed on attempt $attempt. Retrying..."
              sleep 5
            done
            echo "Failed to push NDRT water radar refresh after 3 attempts."
            exit 1
          fi
